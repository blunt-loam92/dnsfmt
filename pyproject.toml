[project]
name = "dnsfmt"
version = "0.1.0"
description = "Normalize messy DNS record listings into a consistent, aligned form"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "blunt-loam92" }]

[project.scripts]
dnsfmt = "dnsfmt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
